# Tea Leader Right Core 配置
# 右主臂使用 GRAVITY + COMPLIANT_DRAG
# gravity_scale=0.3 为当前实机标定值

# 01 model
model:
  urdf_path: ../../model/right/urdf/tea_leader_right.urdf
  joint_names: [right_joint1, right_joint2, right_joint3, right_joint4, right_joint5, right_joint6]
  base_frame: base_link
  tool_frame: right_link6
  gravity: [0.0, 0.0, -9.81]
  gravity_scale: [0.3, 0.3, 0.3, 0.3, 0.3, 0.3]

# 02 calibration
calibration:
  joints:
    right_joint1: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    right_joint2: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    right_joint3: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    right_joint4: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    right_joint5: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    right_joint6: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}

# 03 control
control:
  runtime:
    ctrl_frequency_hz: 100.0
    joint_acc_filter_alpha: 0.2
    write_enabled: true
    model_feedforward_mode: GRAVITY
    tracking_impedance_mode: COMPLIANT_TRACKING
  controller:
    allow_full_cmd: false
    rigid_hold:
      kp: {right_joint1: 0.5, right_joint2: 0.5, right_joint3: 0.5, right_joint4: 0.5, right_joint5: 0.5, right_joint6: 0.5}
      kd: {right_joint1: 0.05, right_joint2: 0.05, right_joint3: 0.05, right_joint4: 0.05, right_joint5: 0.05, right_joint6: 0.05}
    # 归零使用较高的位置刚度，配合小幅静摩擦补偿避免接近零位时卡住
    rigid_tracking:
      kp: {right_joint1: 1.0, right_joint2: 1.0, right_joint3: 1.0, right_joint4: 1.0, right_joint5: 1.0, right_joint6: 1.0}
      kd: {right_joint1: 0.05, right_joint2: 0.05, right_joint3: 0.05, right_joint4: 0.05, right_joint5: 0.05, right_joint6: 0.05}
    compliant_hold:
      kp: {right_joint1: 0.1, right_joint2: 0.1, right_joint3: 0.1, right_joint4: 0.1, right_joint5: 0.1, right_joint6: 0.1}
      kd: {right_joint1: 0.01, right_joint2: 0.01, right_joint3: 0.01, right_joint4: 0.01, right_joint5: 0.01, right_joint6: 0.01}
    compliant_drag:
      kp: {right_joint1: 0.0, right_joint2: 0.0, right_joint3: 0.0, right_joint4: 0.0, right_joint5: 0.0, right_joint6: 0.0}
      kd: {right_joint1: 0.01, right_joint2: 0.01, right_joint3: 0.005, right_joint4: 0.01, right_joint5: 0.0, right_joint6: 0.0}
    compliant_tracking:
      kp: {right_joint1: 0.1, right_joint2: 0.1, right_joint3: 0.1, right_joint4: 0.1, right_joint5: 0.1, right_joint6: 0.1}
      kd: {right_joint1: 0.01, right_joint2: 0.01, right_joint3: 0.01, right_joint4: 0.01, right_joint5: 0.01, right_joint6: 0.01}

# 04 safety_policy
safety_policy:
  position_margin: 0.0
  cmd_vel_scale: 0.5
  state_vel_scale: 1.0
  max_acc:
    right_joint1: 10.8
    right_joint2: 10.8
    right_joint3: 10.8
    right_joint4: 10.8
    right_joint5: 10.8
    right_joint6: 10.8
  max_effort_override:
    right_joint1: 0.80
    right_joint2: 0.80
    right_joint3: 0.80
    right_joint4: 0.80
    right_joint5: 0.80
    right_joint6: 0.80
  max_kp_override:
    right_joint1: 1.0
    right_joint2: 1.0
    right_joint3: 1.0
    right_joint4: 1.0
    right_joint5: 1.0
    right_joint6: 1.0
  max_kd_override:
    right_joint1: 0.1
    right_joint2: 0.1
    right_joint3: 0.1
    right_joint4: 0.1
    right_joint5: 0.1
    right_joint6: 0.1
  max_dt_s: 0.02
  state_timeout_s: 0.05
  cmd_timeout_s: 0.10
  require_all_actuators_online: true
  require_all_actuators_enabled: true
  reject_motor_error: true
  require_continuous_cmd: false
  fault_recovery:
    default_mode: rigid_hold
    allow_compliant_recovery: true
    require_operator_request: true
    gravity_model_validated: true
    recovery_timeout_s: 30.0
    compliant_recovery:
      kp: {right_joint1: 0.0, right_joint2: 0.0, right_joint3: 0.0, right_joint4: 0.0, right_joint5: 0.0, right_joint6: 0.0}
      kd: {right_joint1: 0.01, right_joint2: 0.01, right_joint3: 0.01, right_joint4: 0.01, right_joint5: 0.01, right_joint6: 0.01}
      max_vel: {right_joint1: 0.5, right_joint2: 0.5, right_joint3: 0.5, right_joint4: 0.5, right_joint5: 0.5, right_joint6: 0.5}
      effort_scale: 1.0

# 05 shutdown
shutdown:
  park_before_disable: false
  park_pos:
    right_joint1: 0.0
    right_joint2: 0.0
    right_joint3: 0.0
    right_joint4: 0.0
    right_joint5: 0.0
    right_joint6: 0.0
  speed_scale: 0.10
  position_tolerance: 0.05
  velocity_tolerance: 0.05
  settle_time_s: 0.25
  relaxed_tolerance_ratio: 2.0
  timeout_s: 15.0
