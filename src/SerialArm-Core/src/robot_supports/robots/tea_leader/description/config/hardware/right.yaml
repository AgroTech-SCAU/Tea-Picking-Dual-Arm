# Tea Leader Right - Hiwonder HX-10HM Hardware 配置
#
# 目录
# 01 serial            串口与通信健壮性
# 02 feedback          实时状态与低频诊断策略
# 03 actuator limits   执行器能力与 Software MIT 映射
#
# 力矩说明
# - HX-10HM 标称堵转力矩约 0.980665 N·m（11.1 V）
# - 当前右主操作臂离线重力模型扫描得到最大 |g(q)| 约 0.726629 N·m（J2）
# - 因此 Robot Support 将软件命令上限提高到 0.80 N·m，并使用 pwm_limit=816
# - 0.80 N·m 仅作为软件/峰值上限，不代表建议长期连续负载
# - gravity_scale 默认仍为 0，启用比例必须结合温升、电流与手感逐步验证

hiwonder:
  # 01 serial
  serial_port: /dev/ttyACM0              # HX 总线串口
  baudrate: 1000000                      # HX-10HM 默认 1 Mbps
  read_timeout_ms: 8                     # 单个状态应答等待上限，较原 5 ms 增加瞬态余量
  write_timeout_ms: 20                   # 写入及 ACK 超时
  feedback_timeout_ms: 50                # Core 允许的最近有效反馈年龄
  startup_read_cycles: 3                 # activate 后连续有效状态确认次数
  read_retry_count: 1                    # 实时状态 SYNC READ 瞬态失败时最多重试 1 次

  # 02 feedback
  current_read_divider: 10               # 电流仅作诊断；100 Hz 控制时约 10 Hz 更新，避免每帧第二次 SYNC READ
  velocity_encoding: bit15_sign_magnitude
  torque_feedback_mode: unavailable_zero # 尚未完成电流到真实关节力矩标定，tau_feedback 保持 0
  restore_position_mode_on_deactivate: false

  # 03 actuator limits
  # raw_zero=2048 为已确认机械零位
  # direction=1 表示 HX raw 增大方向映射为 SerialArm 执行器正方向
  # min/max_pos 当前仍是执行器单圈临时范围，不等同最终机械硬限位
  # Torque -> PWM 使用 nominal 线性近似：1019.716213 PWM/(N·m)
  actuators:
    - name: right_hx10hm_1
      joint_name: right_joint1
      servo_id: 1
      raw_zero: 2048
      direction: 1
      min_pos: -3.141592654
      max_pos: 3.140058673
      max_vel: 10.471976
      max_effort: 0.800000
      max_kp: 1.0
      max_kd: 0.1
      positive_gain: 1019.716213
      negative_gain: 1019.716213
      positive_offset: 0.0
      negative_offset: 0.0
      torque_deadband_nm: 0.0
      pwm_limit: 816
    - name: right_hx10hm_2
      joint_name: right_joint2
      servo_id: 2
